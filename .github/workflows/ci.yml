name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "site/**"
      - ".github/workflows/site.yml"
  pull_request:
    paths-ignore:
      - "site/**"
      - ".github/workflows/site.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y shellcheck
      - run: ./tests/lint.sh

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: brew install tmux
      - run: /bin/bash --version | head -1 && tmux -V
      - run: ./tests/run.sh
