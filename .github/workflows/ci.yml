name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y shellcheck
      - run: ./tests/lint.sh

  testes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y tmux
      - if: runner.os == 'macOS'
        run: brew install tmux
      - run: /bin/bash --version | head -1 && tmux -V
      - run: ./tests/run.sh
