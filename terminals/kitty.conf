# >>> workdeck >>>
# Atalhos de macOS traduzidos para o prefixo do tmux (Ctrl+b = \x02).
# O kitty não gerencia abas nem divisões: quem faz isso é o tmux, e por
# isso a sessão sobrevive a fechar o terminal.

enabled_layouts grid

map cmd+b           send_text all \x02
map cmd+h           send_text all \x02h
map cmd+enter       send_text all \x02\r
map cmd+t           send_text all \x02c
map cmd+1           send_text all \x021
map cmd+2           send_text all \x022
map cmd+3           send_text all \x023
map cmd+4           send_text all \x024
map cmd+5           send_text all \x025
map cmd+6           send_text all \x026
map cmd+7           send_text all \x027
map cmd+8           send_text all \x028
map cmd+9           send_text all \x029
map cmd+[           send_text all \x02p
map cmd+]           send_text all \x02n
map cmd+shift+r     send_text all \x02,
map cmd+d           send_text all \x02|
map cmd+shift+d     send_text all \x02-
map cmd+alt+left    send_text all \x02\x1b[D
map cmd+alt+right   send_text all \x02\x1b[C
map cmd+alt+up      send_text all \x02\x1b[A
map cmd+alt+down    send_text all \x02\x1b[B
map cmd+shift+enter send_text all \x02z
map cmd+shift+w     send_text all \x02x
map cmd+shift+e     send_text all \x02d

font_family        JetBrains Mono
font_size          12.0
disable_ligatures  cursor
modify_font        cell_height 110%

window_padding_width 8
macos_option_as_alt  left

# O tema entra aqui pelo install (themes/*.conf)
