# workdeck no Alacritty: tema, fonte e atalhos cmd traduzidos para o tmux.
# Cole na sua config, em ~/.config/alacritty/alacritty.toml.
# \u0002 é o Ctrl+b; o caractere depois dele é a tecla do workdeck.
# No Linux, tire os [[keyboard.bindings]]: lá o tmux já recebe tudo.

[window]
padding = { x = 8, y = 8 }
option_as_alt = "OnlyLeft"

[font]
normal = { family = "JetBrains Mono" }
size = 13.0

[colors.primary]
background = "#1e1e2e"
foreground = "#cdd6f4"

[colors.cursor]
text = "#1e1e2e"
cursor = "#f5e0dc"

[colors.selection]
text = "#cdd6f4"
background = "#45475a"

[colors.normal]
black = "#45475a"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#bac2de"

[colors.bright]
black = "#585b70"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#a6adc8"

[[keyboard.bindings]]
key = "H"
mods = "Command"
chars = "\u0002h"

[[keyboard.bindings]]
key = "Enter"
mods = "Command"
chars = "\u0002\r"

[[keyboard.bindings]]
key = "T"
mods = "Command"
chars = "\u0002c"

[[keyboard.bindings]]
key = "Key1"
mods = "Command"
chars = "\u00021"

[[keyboard.bindings]]
key = "Key2"
mods = "Command"
chars = "\u00022"

[[keyboard.bindings]]
key = "Key3"
mods = "Command"
chars = "\u00023"

[[keyboard.bindings]]
key = "D"
mods = "Command"
chars = "\u0002v"

[[keyboard.bindings]]
key = "D"
mods = "Command|Shift"
chars = "\u0002-"

[[keyboard.bindings]]
key = "Z"
mods = "Command|Shift"
chars = "\u0002z"
