# workdeck — atalhos cmd traduzidos para o prefixo do tmux (Ctrl+b = \x02).
# Cole dentro da sua config do Alacritty, em ~/.config/alacritty/alacritty.toml.
# No Linux troque "Command" por "Alt" — ou não use isto, já que lá os atalhos
# em Alt do tmux funcionam direto.
#
# \u0002 é o Ctrl+b. O caractere depois dele é o comando do tmux.

[[keyboard.bindings]]
key = "T"
mods = "Command"
chars = "\u0002c"

[[keyboard.bindings]]
key = "Key1"
mods = "Command"
chars = "\u00021"

[[keyboard.bindings]]
key = "Key2"
mods = "Command"
chars = "\u00022"

[[keyboard.bindings]]
key = "Key3"
mods = "Command"
chars = "\u00023"

[[keyboard.bindings]]
key = "D"
mods = "Command"
chars = "\u0002|"

[[keyboard.bindings]]
key = "D"
mods = "Command|Shift"
chars = "\u0002-"

[[keyboard.bindings]]
key = "Z"
mods = "Command|Shift"
chars = "\u0002z"

# Siga o mesmo padrão para 4 a 9 e para as demais teclas.
