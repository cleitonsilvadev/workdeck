# Opcional. Copie para ~/.config/workdeck/git-review.conf e ajuste.
# Sem este arquivo, os padrões abaixo valem.

# Branches base, em ordem de preferência. A primeira que existir no repositório
# é a usada por `git review branch`.
BASE_BRANCHES="origin/main origin/master origin/develop origin/dev"

# A partir de quantas colunas abrir o diff lado a lado.
SIDE_BY_SIDE_MIN_COLS=160

# Tema de sintaxe do delta. Vazio deixa o delta decidir (e respeita BAT_THEME).
# Para ver as opções: delta --list-syntax-themes
DELTA_SYNTAX_THEME=""

# 1 impede o git review de rodar enquanto um teste ou build pesado está em
# andamento — o diff com cor de sintaxe compete por CPU. 0 desliga a trava.
GUARD_HEAVY_JOBS=1

# O que conta como "pesado". Acrescente o que a sua stack usa.
HEAVY_JOBS_PATTERN='jest|vitest|cypress|playwright|tsc -b|eslint|vite build|storybook build|pytest|cargo test|cargo build|go test|gradle|mvn |phpunit|rspec'
