# Opcional. Copie para ~/.config/workdeck/git-review.conf e ajuste.
# Sem este arquivo, os padrões abaixo valem.

# A partir de quantas colunas abrir o diff lado a lado.
SIDE_BY_SIDE_MIN_COLS=160

# Tema de sintaxe do delta. Vazio deixa o delta decidir (e respeita BAT_THEME).
# Para ver as opções: delta --list-syntax-themes
DELTA_SYNTAX_THEME=""
