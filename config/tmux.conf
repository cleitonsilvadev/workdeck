# >>> workdeck >>>
# Prefixo: Ctrl+b (o padrão). É ele que o kitty manda.

set -g mouse on

# Janelas e painéis contam a partir de 1, para bater com as teclas
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Cores e teclas modernas
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm-kitty:RGB"
set -g extended-keys on
set -sg escape-time 10
set -g focus-events on

# Histórico grande para rolar saída de teste e de agentes
set -g history-limit 50000

# Dividir mantendo a pasta atual:  |  lado a lado   -  em cima/embaixo
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Ctrl+b r recarrega
bind r source-file ~/.tmux.conf \; display-message "tmux.conf recarregado"

set -g status-left-length 30
setw -g window-status-format " #I #W "
setw -g window-status-current-format " #I #W "

# O tema entra aqui pelo install (themes/*.tmux)
# <<< workdeck <<<
