# >>> workdeck >>>
# Prefixo: Ctrl+b (o padrão).

set -g mouse on

# Janelas e painéis contam a partir de 1, para bater com as teclas
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Cores e teclas modernas
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm-kitty:RGB"
set -as terminal-features ",alacritty:RGB"
set -as terminal-features ",wezterm:RGB"
set -g extended-keys on
set -sg escape-time 10
set -g focus-events on

# Histórico grande para rolar saída de teste e de agentes
set -g history-limit 50000

# ---- atalhos sem prefixo ---------------------------------------------------
# Funcionam em qualquer terminal e em qualquer sistema, porque quem os
# interpreta é o tmux, não o terminal.
#
# Alt+número e Alt+setas são seguros. Alt+letra minúscula NÃO é: o readline
# usa Alt+b, Alt+f, Alt+d e outras para navegar e apagar palavras no shell,
# e um bind aqui roubaria essas teclas. Por isso as ações usam Alt+Shift.

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

bind -n M-S-Left  previous-window
bind -n M-S-Right next-window

bind -n S-Left  previous-window
bind -n S-Right next-window
bind -n S-Up    select-pane -t :.-
bind -n S-Down  select-pane -t :.+

bind -n M-T new-window      -c "#{pane_current_path}"
bind -n M-D split-window -h -c "#{pane_current_path}"
bind -n M-S split-window -v -c "#{pane_current_path}"
bind -n M-Z resize-pane -Z
bind -n M-X kill-pane
bind -n M-R command-prompt -I "#W" "rename-window '%%'"
bind -n M-E detach-client


# ---- com o prefixo ---------------------------------------------------------
unbind -a -T prefix
bind Any display-message "tecla sem uso no workdeck — Ctrl+b h abre o menu"
bind 1 select-window -t :=1
bind 2 select-window -t :=2
bind 3 select-window -t :=3
bind 4 select-window -t :=4
bind 5 select-window -t :=5
bind 6 select-window -t :=6
bind 7 select-window -t :=7
bind 8 select-window -t :=8
bind 9 select-window -t :=9
bind Left  select-pane -L
bind Right select-pane -R
bind Up    select-pane -U
bind Down  select-pane -D
bind n next-window
bind p previous-window
bind z resize-pane -Z
bind x kill-pane
bind , command-prompt -I "#W" "rename-window '%%'"
bind d detach-client
bind Enter if-shell -F "#{e|>:#{pane_width},#{e|*:#{pane_height},2}}" "split-window -h -c '#{pane_current_path}'" "split-window -v -c '#{pane_current_path}'"
bind v split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind = select-layout -E

set-hook -g pane-exited 'run-shell -b "sleep 0.3; work sincronizar"'
set-hook -g after-kill-pane 'run-shell -b "sleep 0.3; work sincronizar"'
bind c new-window -c "#{pane_current_path}"
bind h run-shell "work _menu '#{client_name}' '#{pane_id}'"
bind r source-file ~/.tmux.conf \; display-message "tmux.conf recarregado"

set -g status-interval 10
set -g status-left-length 30
set -g status-right-length 80
set -g status-left "#[bg=#{@wd_accent},fg=#{@wd_on_accent},bold] ❯_ #S #[default] "
set -g status-right "#[fg=#{@wd_accent}]#(git -C '#{pane_current_path}' branch --show-current 2>/dev/null | sed 's/$/ ·/')#[fg=#{@wd_muted}] ctrl+b h menu · %H:%M "
setw -g window-status-separator ""
setw -g window-status-style "default"
setw -g window-status-current-style "default"
setw -g window-status-last-style "default"
setw -g window-status-activity-style "default"
setw -g window-status-format "#[fg=#{@wd_muted}] #I #W#{?#{@ia},#[fg=#{@wd_accent}] ✦,} "
setw -g window-status-current-format "#[fg=#{@wd_accent},bold] #I #[fg=#{@wd_text}]#W#{?#{@ia},#[fg=#{@wd_accent}] ✦,} #[default]"

set-hook -g after-split-window 'run-shell -b "work sincronizar"'

# O tema entra aqui pelo install (themes/*.tmux)
# <<< workdeck <<<
