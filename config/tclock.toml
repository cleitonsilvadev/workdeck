# Painel do workdeck. Teclas: g troca grupo · t abre a lista com links · Esc fecha · q sai
#
# Cada widget é um comando que o tclock roda e redesenha de tempos em tempos.
# Qualquer executável que imprima texto serve — veja "Fazendo o seu" no README.

[clock]
show_date = true
# Cor dos textos. Aceita um hex ou um nome (Red, Blue, Cyan...).
color = "#d58a9d"

[[clock.widgets]]
title = "Máquina"
group = "sistema"
command = ["painel-sistema"]
refresh_secs = 60

# Daqui para baixo é exemplo. Descomente e troque pelos seus comandos.
#
# Widgets com o mesmo `group` aparecem juntos na tela; a tecla g alterna
# entre os grupos. `popup_actions` cria uma tecla que abre uma visão maior,
# útil quando a saída completa não cabe no painel.
#
# [[clock.widgets]]
# title = "Containers"
# group = "dev"
# command = ["docker", "ps", "--format", "{{.Names}}  {{.Status}}"]
