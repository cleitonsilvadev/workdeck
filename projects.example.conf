# Uma linha por janela do tmux:
#
#   nome|caminho|comando opcional
#
# nome     vira o nome da janela no tmux (e o argumento de `work <nome>`)
# caminho  a pasta em que a janela abre; aceita ~ e $HOME
# comando  opcional — se existir, a janela roda isso ao abrir
#
# A ordem aqui é a ordem das janelas, e a numeração começa em 1.
# Projeto que não existir no disco é pulado sem erro, então dá para
# deixar linhas de projetos que você ainda não clonou.
#
# Copie este arquivo para ~/.config/workdeck/projects.conf e edite.

exemplo|$HOME/projetos/exemplo

# Acrescente quantos quiser, um por linha:
# api|$HOME/projetos/minha-api
# web|$HOME/projetos/meu-front
# notas|~/notas
#
# A última janela costuma ser o painel, que abre um comando em vez de um shell:
# painel|$HOME|work-panel
