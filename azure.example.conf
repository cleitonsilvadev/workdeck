# Dados do seu Azure DevOps. Copie para ~/.config/workdeck/azure.conf
# e edite. Este arquivo fica FORA do repositório de propósito: ele tem
# o nome da sua organização, dos seus projetos e o seu e-mail.
#
# Precisa do az cli autenticado:
#   brew install azure-cli
#   az login
#   az extension add --name azure-devops

# A URL da sua organização.
AZDO_ORG="https://dev.azure.com/sua-organizacao"

# Seu e-mail no Azure DevOps. O painel-prs usa para marcar
# o que você criou e o que está esperando a sua revisão.
AZDO_EMAIL="voce@empresa.com"

# Projeto|Time — um por linha. O painel-tasks busca a sprint atual de cada um.
AZDO_TEAMS=(
  "Meu Projeto|Meu Projeto Team"
)

# Projeto|repositório — um por linha. O painel-prs lista os PRs abertos de cada um.
AZDO_REPOS=(
  "Meu Projeto|meu-repositorio"
)

# rótulo|nome do pipeline|branch (a branch é opcional).
# O painel-pipelines mostra a última execução de cada linha.
AZDO_PIPELINE_PROJECT="Meu Projeto"
AZDO_PIPELINES=(
  "app dev|meu-pipeline-dev"
  "api main|meu-pipeline-api|main"
)
